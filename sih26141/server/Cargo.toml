[package]
name = "server"
version = "0.1.0"
edition = "2021"

[dependencies]
quantum = { path = "../quantum" }
detection = { path = "../detection" }
crypto = { path = "../crypto" }
qds = { path = "../qds" }
hex = "0.4.3"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["cors", "fs"] }
rand = "0.8.5"
